      MOLONI_DOCUMENT_SET_ID: ""
      MOLONI_CUSTOMER_ID: ""
      MOLONI_PAYMENT_METHOD_ID: ""
      MOLONI_PRODUCT_ID: ""
      INVOICING_PROVIDER: "MOCK"
      MOCK_INVOICE_PREFIX: "FT"
      MOCK_INVOICE_BASE_URL: "https://cdn.nexus-estates.local/mock"
    depends_on:
      postgres:
        condition: service_healthy
      booking-service:
        condition: service_started
    networks:
      - nexus-net

  api-gateway:
    image: ghcr.io/kanekitakitos/nexus-estates/api-gateway:${IMAGE_TAG:-main}
    container_name: api-gateway
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      USER_SERVICE_URL: "http://user-service:8083"
      PROPERTY_SERVICE_URL: "http://property-service:8082"
      BOOKING_SERVICE_URL: "http://booking-service:8081"
      SYNC_SERVICE_URL: "http://sync-service:8084"
      FINANCE_SERVICE_URL: "http://finance-service:8085"
      JWT_SECRET: "AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8="
    depends_on:
      user-service:
        condition: service_started
      property-service:
        condition: service_started
      booking-service:
        condition: service_started
      sync-service:
        condition: service_started
      finance-service:
        condition: service_started
    ports:
      - "8080:8080"
    networks:
      - nexus-net

  frontend:
    image: ghcr.io/kanekitakitos/nexus-estates/frontend:${IMAGE_TAG:-main}
    container_name: frontend
    restart: unless-stopped
    environment:
      NODE_ENV: "production"
      NEXT_PUBLIC_IDP: "${NEXT_PUBLIC_IDP:-jwt}"
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8080/api}"
    depends_on:
      api-gateway:
        condition: service_started
    ports:
      - "3000:3000"
    networks:
      - nexus-net

volumes:
  postgres_data:

networks:
  nexus-net:
