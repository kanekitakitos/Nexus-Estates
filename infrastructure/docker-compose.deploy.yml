      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/sync_db"
      SPRING_DATASOURCE_USERNAME: "admin"
      SPRING_DATASOURCE_PASSWORD: "password"
      SPRING_RABBITMQ_HOST: "rabbitmq"
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: "guest"
      SPRING_RABBITMQ_PASSWORD: "guest"
      USER_SERVICE_URL: "http://user-service:8083"
      BOOKING_SERVICE_URL: "http://booking-service:8081"
      PROPERTY_SERVICE_URL: "http://property-service:8082"
      SPRING_MAIL_HOST: "sandbox.smtp.mailtrap.io"
      SPRING_MAIL_PORT: "2525"
      SPRING_MAIL_USERNAME: "41863bb195d587"
      SPRING_MAIL_PASSWORD: "f0a9f1220b3d73"
