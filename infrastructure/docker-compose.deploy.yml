  finance-service:
    image: ghcr.io/kanekitakitos/nexus-estates/finance-service:${IMAGE_TAG:-main}
    container_name: finance-service
    restart: unless-stopped
    environment:
      SERVER_PORT: "8085"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/finance_db"
      SPRING_DATASOURCE_USERNAME: "admin"
      SPRING_DATASOURCE_PASSWORD: "password"
      BOOKING_SERVICE_URL: "http://booking-service:8081"
      STRIPE_SECRET_KEY: "sk_test_51T56JZKFO2JxGBKSTdTct1pbOCqgOtmUCIaezPuc3IGDII7mJNh51YzIeve7ffJMUB10syLzaKeJ0AEgjV0nS52Y00NkjzjZG4"
      STRIPE_PUBLISHABLE_KEY: "pk_test_51T56JZKFO2JxGBKSSdPLo5P5jbfIpQYal353IzHmVnEdezEDQV1CUwiDKbQkIuH6RePTdyzCV8LbsFawxQVy5XOM00Nl6KLeZ8"
