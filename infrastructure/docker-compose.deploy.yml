services:
  postgres:
    image: ghcr.io/kanekitakitos/nexus-estates/postgres:${IMAGE_TAG:-main}
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_MULTIPLE_DATABASES: "booking_db,property_db,user_db,sync_db,finance_db"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - nexus-net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - nexus-net

  user-service:
    image: ghcr.io/kanekitakitos/nexus-estates/user-service:${IMAGE_TAG:-main}
    container_name: user-service
    restart: unless-stopped
    environment:
      SERVER_PORT: "8083"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/user_db?sslmode=disable"
      SPRING_DATASOURCE_USERNAME: "admin"
      SPRING_DATASOURCE_PASSWORD: "password"
      USER_SERVICE_URL: "http://user-service:8083"
      JWT_SECRET: "AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8="
      JWT_EXPIRATION_MS: "86400000"
      MASTER_KEY: "s/71+z/zgtFWIVNc9v2zmvqmqDu0GHDzyQQG/bZkEkc="
      CLERK_JWKS_URL: "https://maximum-yak-19.clerk.accounts.dev/.well-known/jwks.json"
      CLERK_ISSUER: "https://maximum-yak-19.clerk.accounts.dev"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexus-net

  property-service:
    image: ghcr.io/kanekitakitos/nexus-estates/property-service:${IMAGE_TAG:-main}
    container_name: property-service
    restart: unless-stopped
    environment:
      SERVER_PORT: "8082"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/property_db"
      SPRING_DATASOURCE_USERNAME: "admin"
      SPRING_DATASOURCE_PASSWORD: "password"
      SPRING_RABBITMQ_HOST: "rabbitmq"
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: "guest"
      SPRING_RABBITMQ_PASSWORD: "guest"
      CLOUDINARY_NAME: "@dsfjm1ncn"
      CLOUDINARY_API_KEY: "396424475647115"
      CLOUDINARY_API_SECRET: "l3YJgUb18eQ79gCqruqxk42zV-M"
      CLOUDINARY_URL: "cloudinary://396424475647115:l3YJgUb18eQ79gCqruqxk42zV-M@dsfjm1ncn"
      CLOUDINARY_FOLDER: "nexus_estates/properties"
      CLOUDINARY_FETCH_ENABLED: "false"
      CLOUDINARY_FETCH_TRANSFORM: "f_auto,q_auto,c_limit,w_1200"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - nexus-net

  booking-service:
    image: ghcr.io/kanekitakitos/nexus-estates/booking-service:${IMAGE_TAG:-main}
    container_name: booking-service
    restart: unless-stopped
    environment:
      SERVER_PORT: "8081"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/booking_db"
      SPRING_DATASOURCE_USERNAME: "admin"
      SPRING_DATASOURCE_PASSWORD: "password"
      SPRING_RABBITMQ_HOST: "rabbitmq"
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: "guest"
      SPRING_RABBITMQ_PASSWORD: "guest"
      PROPERTY_SERVICE_URL: "http://property-service:8082"
      USER_SERVICE_URL: "http://user-service:8083"
      FINANCE_SERVICE_URL: "http://finance-service:8085"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      user-service:
        condition: service_started
      property-service:
        condition: service_started
    networks:
      - nexus-net

  sync-service:
    image: ghcr.io/kanekitakitos/nexus-estates/sync-service:${IMAGE_TAG:-main}
    container_name: sync-service
    restart: unless-stopped
