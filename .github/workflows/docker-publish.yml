name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
      - Testar_software

env:
  REGISTRY: ghcr.io
  # O github.repository vai ser kanekitakitos/Nexus-Estates
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    # Permissões necessárias para o GITHUB_TOKEN fazer push para o GHCR
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            build_args: |
              NEXT_PUBLIC_API_URL=http://localhost:8080/api
              NEXT_PUBLIC_IDP=jwt
          - name: api-gateway
            context: ./backend
            dockerfile: ./backend/Dockerfile
            build_args: |
              SERVICE=api-gateway
          - name: booking-service
            context: ./backend
            dockerfile: ./backend/Dockerfile
            build_args: |
              SERVICE=booking-service
          - name: property-service
            context: ./backend
            dockerfile: ./backend/Dockerfile
            build_args: |
              SERVICE=property-service
          - name: sync-service
            context: ./backend
            dockerfile: ./backend/Dockerfile
            build_args: |
              SERVICE=sync-service
          - name: finance-service
            context: ./backend
            dockerfile: ./backend/Dockerfile
            build_args: |
              SERVICE=finance-service
          - name: user-service
            context: ./backend
            dockerfile: ./backend/Dockerfile
            build_args: |
              SERVICE=user-service
          - name: postgres
            context: ./infrastructure/postgres
            dockerfile: ./infrastructure/postgres/Dockerfile
            build_args: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize image prefix
        run: |
          echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set Image Name
        id: set-name
        run: |
          echo "image_name=${{ matrix.service.name }}" >> $GITHUB_ENV

      # Setup do Docker Buildx (necessário para usar a cache avançada)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Usa o nome da branch como tag (main ou staging)
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ env.image_name }}
          tags: |
            type=ref,event=branch
            type=sha

      # Build e push com cache para performance
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          build-args: ${{ matrix.service.build_args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Otimização: usa a cache do GHCR para acelerar builds subsequentes
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/${{ env.image_name }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}/${{ env.image_name }}:buildcache,mode=max
